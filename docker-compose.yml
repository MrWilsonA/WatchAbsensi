services:
  postgres-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-watchabsensi}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  cv-engine:
    build: {context: ./src/cv-engine-python, dockerfile: ../../docker/cv-engine/Dockerfile}
    ports: ["8002:8002"]
    depends_on: [postgres-db, redis]
  frontend:
    image: nginx:alpine
    ports: ["3000:80"]
    volumes: ["./src/frontend-client:/usr/share/nginx/html:ro"]
    depends_on: [cv-engine]
volumes: {pgdata: {}}
