<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WatchAbsensi</title><style>body{font-family:Inter,system-ui;background:#f4f7fb;color:#172033;margin:0}header{background:#101a36;color:#fff;padding:24px 6%;display:flex;justify-content:space-between}main{max-width:1100px;margin:32px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 24px #18254b12}.value{font-size:32px;font-weight:800;margin-top:8px}.ok{color:#10966f}button{background:#3867f5;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}video{width:100%;max-width:640px;border-radius:16px;background:#101a36}section{margin-top:28px}</style></head><body><header><strong>WatchAbsensi</strong><span>Biometric Workforce Platform</span></header><main><h1>Dashboard Kehadiran</h1><div class="grid" id="stats"></div><section class="card"><h2>Live Kiosk</h2><video id="video" autoplay muted></video><p id="msg">Kamera siap. Mulai verifikasi wajah.</p><button onclick="start()">Aktifkan Kamera</button></section></main><script>async function load(){let r=await fetch('http://localhost:8002/v1/analytics/summary');let d=await r.json();stats.innerHTML=[['Hadir',d.present,'ok'],['Terlambat',d.late,''],['Tidak Hadir',d.absent,''],['Tingkat Kehadiran',(d.attendance_rate*100).toFixed(1)+'%','ok']].map(x=>`<div class="card"><small>${x[0]}</small><div class="value ${x[2]}">${x[1]}</div></div>`).join('')}async function start(){try{video.srcObject=await navigator.mediaDevices.getUserMedia({video:true});msg.textContent='Kamera aktif — arahkan wajah ke kamera untuk verifikasi.'}catch(e){msg.textContent='Izin kamera diperlukan untuk memulai kiosk.'}}load()</script></body></html>
